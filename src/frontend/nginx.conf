server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: every unknown path serves the React entry.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + streaming replies must not be buffered by nginx.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding off;
    }

    # No /uploads location: the backend no longer mounts the uploads directory as
    # public static files. Learner recordings are served by
    # /api/pronunciation/recordings/{id} (ownership-checked); synthesized replies by
    # /api/speech/tts-file/{name}. Both flow through the /api/ block above.

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
